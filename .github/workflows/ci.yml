name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: CSV parser tests
        run: npm run test:csv

      - name: Production build
        run: npm run build

  # Optional but recommended: add TEACHER_EMAIL / TEACHER_PASSWORD as repo
  # secrets and this runs the full 60-assertion security suite in CI too.
  security:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.secrets.TEACHER_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security regression suite
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEACHER_EMAIL: ${{ secrets.TEACHER_EMAIL }}
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}
        run: npm run test
