name: Scheduled backup

on:
  schedule:
    # Daily at 01:00 UTC (adjust if you want a different time).
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export all class data
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEACHER_EMAIL: ${{ secrets.TEACHER_EMAIL }}
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}
        run: node scripts/backup.mjs

      # Artifacts are private to repo collaborators. 90-day rolling window.
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
